# KineLab production-like stack (R1): public web only; RTMW internal.
# Usage: docker compose -f docker-compose.prod.yml up --build -d
# Models: mount checkpoint + OpenSim model; checksums verified at startup.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BIOMECH_URL: /api
        VITE_RELEASE_CHANNEL: ${KINELAB_RELEASE_CHANNEL:-RESEARCH_PREVIEW}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0-beta}
    ports:
      - "${KINELAB_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true

  backend:
    build:
      context: ./services/biomechanics
      dockerfile: Dockerfile
    environment:
      KINELAB_RELEASE_CHANNEL: ${KINELAB_RELEASE_CHANNEL:-RESEARCH_PREVIEW}
      KINELAB_CORS_ORIGINS: ${KINELAB_CORS_ORIGINS:-https://kinelab.example.org}
      KINELAB_RTMW_URL: http://rtmw:8102
      KINELAB_OPENSIM_MODEL: /models/gait2392_thelen2003muscle.osim
      KINELAB_STORAGE_ROOT: /data
      KINELAB_MAX_BUNDLE_MB: ${KINELAB_MAX_BUNDLE_MB:-4096}
      KINELAB_MAX_VIDEO_MB: ${KINELAB_MAX_VIDEO_MB:-2048}
      KINELAB_MAX_CAMERAS: ${KINELAB_MAX_CAMERAS:-12}
      KINELAB_MAX_CONCURRENT_JOBS: ${KINELAB_MAX_CONCURRENT_JOBS:-2}
      KINELAB_LOG_LEVEL: ${KINELAB_LOG_LEVEL:-INFO}
    volumes:
      - kinelab-data:/data
      - kinelab-models:/models:ro
      - kinelab-cache:/cache
      - kinelab-logs:/logs
    expose:
      - "8101"
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  rtmw:
    build:
      context: ./services/biomechanics
      dockerfile: runtime/Dockerfile.rtmw
    environment:
      KINELAB_MODEL_DIR: /models
    volumes:
      - kinelab-models:/models:ro
      - kinelab-cache:/cache
    expose:
      - "8102"
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  kinelab-data:
  kinelab-models:
  kinelab-cache:
  kinelab-logs:
